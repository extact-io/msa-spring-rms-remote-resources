logging.level:
  org.springframework: info
    #transaction: info
    #security: trace
    #context.support.ResourceBundleMessageSource: DEBUG

server.port: 8081
    
spring:
  messages:
    basename: fw-messages
    encoding: UTF-8
  profiles:
    default: item,reservation,user
  mvc:
    format:
      date: yyyyMMdd
      date-time: yyyyMMdd HH:mm

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "env,beans"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db"
      validate-group-membership: false # groupにindicatorが存在しない場合もエラーにしない設定

  # =======
  # ＜TelemetryパイプラインはOTEL+HTTPの標準的な構成＞
  # metrics(micrometer-registry-otlp) ------------(HTTP)--┐                ┌-- (http://prometheus:9090/api/v1/otlp) -> Prometheus/otlp-receiver
  # tracing(micrometer-tracing-bridge-otel) ------(gRPC)--├--> collector --┤-- (http://tempo:4418) ------------------> Grafana Tempo
  # logging(opentelemetry-logback-appender-1.0) --(gRPC)--┘                └-- (http://loki:3100/otlp) --------------> Grafana Loki
  # =======
  metrics:
    tags:
      application: ${spring.application.name}
      instance: "host.docker.internal:8080"
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0  # 100%サンプリング（開発環境向け）
  otlp:
    metrics:
      export:
        enabled: false
        url: "http://localhost:4318/v1/metrics" # MicrometerはgRPCは未サポート
        step: 2s
    tracing:
      export:
        enabled: false
      transport: grpc
      endpoint: "http://localhost:4317" # for gRPC
    logging:
      export:
        enabled: false
      transport: grpc
      endpoint: "http://localhost:4317" # for gRPC
      
rms:
  log:
    server:
      enable: false
  rest:
    controller:
      format:
        date: ${spring.mvc.format.date}
        date-time: ${spring.mvc.format.date-time}
  resources:
    item: classpath:/json/item.json
    reservation: classpath:/json/reservation.json
    user: classpath:/json/user.json
